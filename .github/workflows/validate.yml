name: Validate plugins

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get bwr-plugin-check from the latest BigWave Radio release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo postmanpat-303/BigWaveRadio --pattern 'bwr-plugin-check-linux-x64' --dir bin
          chmod +x bin/bwr-plugin-check-linux-x64
          bin/bwr-plugin-check-linux-x64 --version

      - name: Find changed plugins
        id: changed
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [ -n "$base" ]; then
            dirs=$(git diff --name-only "$base"...HEAD -- plugins/ | cut -d/ -f1-2 | sort -u | tr '\n' ' ')
          else
            dirs=$(ls -d plugins/*/ | sed 's:/$::' | tr '\n' ' ')
          fi
          echo "Changed: $dirs"
          echo "dirs=$dirs" >> "$GITHUB_OUTPUT"

      - name: Validate (template always included)
        run: python3 scripts/validate.py bin/bwr-plugin-check-linux-x64 ${{ steps.changed.outputs.dirs }} templates/hello-plugin

      - name: Post the summary on the PR
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f summary.md ] || exit 0
          gh pr comment "${{ github.event.pull_request.number }}" --body-file summary.md --edit-last \
            || gh pr comment "${{ github.event.pull_request.number }}" --body-file summary.md
