name: Publish catalog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get bwr-plugin-check from the latest BigWave Radio release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo postmanpat-303/BigWaveRadio --pattern 'bwr-plugin-check-linux-x64' --dir bin
          chmod +x bin/bwr-plugin-check-linux-x64

      - name: Validate every plugin
        run: python3 scripts/validate.py bin/bwr-plugin-check-linux-x64 plugins/*/

      - name: Zip plugins, build catalog.json and CATALOG.md
        run: python3 scripts/build_catalog.py dist "https://github.com/${{ github.repository }}/releases/download/catalog"

      - name: Publish the rolling 'catalog' release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Rolling release: one .zip per plugin, plus catalog.json. Updated automatically on every push to main. See [CATALOG.md](https://github.com/${{ github.repository }}/blob/main/CATALOG.md)."
          if ! gh release view catalog >/dev/null 2>&1; then
            gh release create catalog --title "Plugin catalog" --notes "$notes" --latest=false
          fi
          gh release upload catalog dist/*.zip catalog.json --clobber
          # Remove zips of plugins that no longer exist.
          for a in $(gh release view catalog --json assets -q '.assets[].name'); do
            case "$a" in
              *.zip) [ -f "dist/$a" ] || gh release delete-asset catalog "$a" -y ;;
            esac
          done
          gh release view catalog --json assets -q '.assets[].name'

      - name: Commit catalog.json and CATALOG.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json CATALOG.md
          if git diff --cached --quiet; then echo "catalog unchanged"; exit 0; fi
          git commit -m "catalog: update [skip ci]"
          git push
